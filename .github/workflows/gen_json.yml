name: Generate m3u8 input.json (1-2000)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Generate input.json with 2000 channels
        run: python script/gen_json.py

      - name: Configure Git
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit generated input.json
        id: commit
        run: |
          git add files/input.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: generate input.json with channels 1-2000 [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        run: |
          git push origin HEAD:${{ github.ref_name }}